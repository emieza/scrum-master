{% load socialaccount %}
{% get_providers as socialaccount_providers %}
{% if socialaccount_providers %}
  <div class="social-login">
    <p class="muted">O continua amb</p>
    {% for provider in socialaccount_providers %}
      {% provider_login_url provider process="login" as provider_login_url %}
      <a class="btn block" href="{{ provider_login_url }}">Continua amb {{ provider.name }}</a>
    {% endfor %}
  </div>
{% endif %}
